[workspace]
resolver = "3"
members = ["crates/*", "."]
default-members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
bitflags = "2.10.0"
duplicate = "2.0.1"
interflow-core = { path = "crates/interflow-core" }
interflow-coreaudio = { path = "crates/interflow-coreaudio" }
log = "0.4.29"
scattered-collect = "0.21.3"
thiserror = "2.0.18"

[package]
name = "interflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
interflow-core = { workspace = true, features = ["collect"] }
scattered-collect.workspace = true
log.workspace = true

[dev-dependencies]
anyhow.workspace = true
env_logger = "0.11.8"
dialoguer = { version = "0.12.0", features = ["completion", "fuzzy-select"] }
indicatif = "0.18.3"

[build-dependencies]
cfg_aliases = "0.2.1"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
interflow-coreaudio = { workspace = true, features = ["collect"] }

# [target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd"))'.dependencies]
