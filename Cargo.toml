# nix = "0.31.1"
# pipewire = { version = "0.8.0", optional = true, features = ["v0_3_45"] }

[target.'cfg(target_os = "windows")'.dependencies]
interflow-wasapi = { path = "crates/interflow-wasapi", features = ["collect"] }
